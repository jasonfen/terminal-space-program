name: test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # The two suites ran serially (~4 + ~3 min); as parallel jobs the wall
    # time is the longer one.
    strategy:
      fail-fast: false
      matrix:
        include:
          # internal/sim has no goroutines or sync in production code, so -race
          # finds nothing there and costs ~8x; every other package keeps it.
          - suite: race
            flags: -race
            pkgs: $(go list ./... | grep -v '/internal/sim$')
          - suite: sim
            flags: ''
            pkgs: ./internal/sim
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: go vet
        if: matrix.suite == 'race'
        run: go vet ./...

      # -json output is tee'd for the skip gate below and rendered back to
      # the usual quiet text by jq (RUN/PASS lines dropped; failures, skips and
      # package results stay).
      - name: go test
        shell: bash
        run: |
          go test ${{ matrix.flags }} -count=1 -json ${{ matrix.pkgs }} | tee test.json | jq -Rrj 'fromjson? | .Output // empty | select(test("^(=== |\\s*--- PASS|PASS$)") | not)'

      # A skip is not a pass: a test that skips (or a subtest that does)
      # reads green while checking nothing. The only skips allowed are the
      # two env-gated diagnostics; everything else must run or be deleted.
      - name: no unexpected skips
        shell: bash
        run: |
          bad=$(jq -Rr 'fromjson? | select(.Action == "skip" and .Test != null)
            | select((.Test | split("/")[0]) | IN("TestDiagFastSweep", "TestSOIEntryPredictionEval") | not)
            | "\(.Package) \(.Test)"' test.json)
          if [ -n "$bad" ]; then
            echo "::error::tests skipped unexpectedly (fix the fixture or delete the test):"
            echo "$bad"
            exit 1
          fi

  # nixpkgs packages tsp and r-ryantm bumps it on each release, but only
  # when the release builds under nixpkgs' recipe (ldflags version stamp,
  # tests in the Nix sandbox). A failure there silently freezes the
  # package, as 0.51.2 -> 0.68.0 did over TestLaunchViewRenderTitle.
  nix:
    name: nixpkgs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # First pass fetches the Go modules against a fake hash to learn the
      # real vendorHash; the second pass is the actual build and test run.
      - name: nix-build (nixpkgs recipe)
        shell: bash
        run: |
          # (expected to fail; `|| true` keeps the step's -e/pipefail from aborting)
          hash=$(nix-build nix/nixpkgs-build.nix 2>&1 | awk '/got:/{print $2}' | tail -1 || true)
          if [ -z "$hash" ]; then echo "::error::could not determine vendorHash"; exit 1; fi
          echo "vendorHash: $hash"
          nix-build nix/nixpkgs-build.nix --argstr vendorHash "$hash"

      # The flake carries a committed vendorHash: a go.mod/go.sum change that
      # does not update it in flake.nix fails here, the new hash on "got:".
      - name: nix build (flake)
        run: nix build .#default -L && ./result/bin/terminal-space-program --version

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      # Fails only on known vulnerabilities our code actually reaches.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
